[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-ra --strict-markers"
markers = [
    "integration: tests that require a running Postgres test database",
]
asyncio_mode = "auto"

[tool.ruff]
line-length = 110
target-version = "py312"
extend-exclude = ["alembic/versions", "data", ".venv"]

[tool.ruff.lint]
select = ["E", "F", "W"]
ignore = [
    "E501",
    "E402",
]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401"]
