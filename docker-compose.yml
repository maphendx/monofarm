services:
  db:
    image: postgres:16-alpine
    container_name: printfarm-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: printfarm
      POSTGRES_PASSWORD: printfarm
      POSTGRES_DB: printfarm
    ports:
      - "5432:5432"
    volumes:
      - printfarm-pgdata:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: redis-server --save "" --appendonly no
    # Internal-only: tenant commands and temporary tunnel data must not be public.
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  web:
    build: ./backend
    container_name: monofarm-web
    restart: unless-stopped
    command: >
      sh -c "alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port 8000 --workers 4"
    env_file: ./backend/.env
    environment:
      INLINE_WORKERS: "false"
      REDIS_URL: redis://redis:6379/0
      DATABASE_URL: postgresql+psycopg://printfarm:printfarm@db:5432/printfarm
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_started
      redis:
        condition: service_healthy
    volumes:
      - ./backend/data:/app/data

  worker:
    build: ./backend
    container_name: monofarm-worker
    restart: unless-stopped
    command: python -m app.workers.main
    env_file: ./backend/.env
    environment:
      INLINE_WORKERS: "false"
      REDIS_URL: redis://redis:6379/0
      DATABASE_URL: postgresql+psycopg://printfarm:printfarm@db:5432/printfarm
    depends_on:
      db:
        condition: service_started
      redis:
        condition: service_healthy
    # No published ports — worker talks outbound only (MQTT, Telegram, APScheduler)

  frontend:
    build: ./frontend
    container_name: monofarm-frontend
    restart: unless-stopped
    command: bun run start
    env_file: ./frontend/.env.local
    ports:
      - "3000:3000"
    depends_on:
      - web

  go2rtc:
    image: alexxit/go2rtc
    container_name: printfarm-go2rtc
    restart: unless-stopped
    # host networking so go2rtc can reach printers on the local LAN
    network_mode: host
    volumes:
      - ./go2rtc.yaml:/config/go2rtc.yaml:ro

volumes:
  printfarm-pgdata:
