name: CI

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]

jobs:
  release_plan:
    name: Agent release plan
    runs-on: ubuntu-latest
    outputs:
      publish: ${{ steps.plan.outputs.publish }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - id: plan
        name: Enforce agent version boundary
        shell: bash
        run: |
          set -euo pipefail
          echo "publish=false" >> "$GITHUB_OUTPUT"
          if [[ "$GITHUB_EVENT_NAME" != "push" || "$GITHUB_REF" != "refs/heads/main" ]]; then
            exit 0
          fi

          BEFORE="${{ github.event.before }}"
          if [[ -z "$BEFORE" || "$BEFORE" =~ ^0+$ ]]; then
            BEFORE="$(git rev-parse HEAD^)"
          fi
          CURRENT_VERSION="$(python -c 'import pathlib, re; text=pathlib.Path("agent/monofarm_agent.py").read_text(); match=re.search(r"^AGENT_VERSION = \"([^\"]+)\"$", text, re.MULTILINE); print(match.group(1) if match else "")')"
          PREVIOUS_VERSION="$(git show "${BEFORE}:agent/monofarm_agent.py" | python -c 'import re, sys; match=re.search(r"^AGENT_VERSION = \"([^\"]+)\"$", sys.stdin.read(), re.MULTILINE); print(match.group(1) if match else "")')"
          test -n "$CURRENT_VERSION"
          test -n "$PREVIOUS_VERSION"

          RUNTIME_PATTERN='^agent/(monofarm_agent\.py|monofarm_tray\.py|command_worker\.py|command_runtime\.py|device_identity\.py|network_policy\.py|printer_runtime\.py|provider_adapters\.py|update_policy\.py|requirements\.txt|monofarm-agent\.spec|edge_runtime/)'
          RUNTIME_CHANGED="$(git diff --name-only "$BEFORE" "$GITHUB_SHA" -- agent/ | grep -E "$RUNTIME_PATTERN" || true)"
          if [[ -n "$RUNTIME_CHANGED" && "$CURRENT_VERSION" == "$PREVIOUS_VERSION" ]]; then
            echo "::error::Agent runtime changed without AGENT_VERSION bump"
            printf '%s\n' "$RUNTIME_CHANGED"
            exit 1
          fi
          if [[ "$CURRENT_VERSION" != "$PREVIOUS_VERSION" ]]; then
            echo "publish=true" >> "$GITHUB_OUTPUT"
          fi

  backend:
    name: Backend (lint + tests)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: printfarm
          POSTGRES_PASSWORD: printfarm
          POSTGRES_DB: printfarm_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.14
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Ruff lint
        run: ruff check .

      - name: Run tests
        env:
          TEST_DATABASE_URL: postgresql+psycopg://printfarm:printfarm@localhost:5432/printfarm_test
        run: pytest -ra

      - name: Verify Alembic migrations apply cleanly
        env:
          DATABASE_URL: postgresql+psycopg://printfarm:printfarm@localhost:5432/printfarm_test
          SECRET_KEY: ci-only-secret-not-used-at-runtime
        # Recreate the schema (pytest left state in it), then run migrations
        # end-to-end. Catches divergence between models and migrations that
        # the SQLAlchemy create_all() path in pytest doesn't exercise.
        run: |
          python <<'PY'
          from sqlalchemy import create_engine, text
          import os
          e = create_engine(os.environ["DATABASE_URL"])
          with e.connect() as c:
              c.execute(text("DROP SCHEMA public CASCADE"))
              c.execute(text("CREATE SCHEMA public"))
              c.commit()
          PY
          alembic upgrade head

  frontend:
    name: Frontend (lint + build)
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v4

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Lint (advisory)
        # Next.js 16 / React 19 introduced new strict rules (react-hooks/
        # set-state-in-effect) that flag legacy patterns in the codebase.
        # See TECH_DEBT.md for the cleanup list. Lint is advisory until that
        # is fixed; the build step below is the hard gate.
        continue-on-error: true
        run: bun run lint

      - name: Build
        env:
          # next build statically renders pages; without this it tries to reach
          # the API and fails in CI.
          NEXT_PUBLIC_API_URL: http://localhost:8000
        run: bun run build

  agent_release:
    name: Publish signed agent release
    needs: [backend, frontend, release_plan]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && needs.release_plan.outputs.publish == 'true'
    uses: ./.github/workflows/agent-build.yml
    secrets: inherit
