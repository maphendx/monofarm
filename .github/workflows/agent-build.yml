name: Build agent exe

# Builds monofarm-agent.exe on a Windows runner and uploads it as a
# GitHub Actions artifact.  When R2 secrets are configured it also
# publishes the binary to Cloudflare R2 so the backend can serve it at
# GET /agent/monofarm-agent.exe.
#
# Trigger: push a tag like  agent-v0.8.1  or use workflow_dispatch.

on:
  workflow_dispatch:
  push:
    tags:
      - 'agent-v*'

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install build deps
        working-directory: agent
        run: |
          python -m pip install --upgrade pip
          pip install pyinstaller -r requirements.txt

      - name: Build exe
        working-directory: agent
        run: pyinstaller --noconfirm monofarm-agent.spec

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: monofarm-agent-exe
          path: agent/dist/monofarm-agent.exe
          if-no-files-found: error

      - name: Publish to R2
        if: env.R2_ENDPOINT != ''
        env:
          R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_KEY }}
          AWS_DEFAULT_REGION: auto
        shell: bash
        run: |
          aws s3 cp agent/dist/monofarm-agent.exe \
            "s3://${{ secrets.R2_BUCKET }}/agent/monofarm-agent.exe" \
            --endpoint-url "${{ secrets.R2_ENDPOINT }}" \
            --content-type application/vnd.microsoft.portable-executable
