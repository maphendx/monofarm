<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 284 88" width="284" height="88" role="img">
  <title>monofarm</title>

  <!-- pixel-art mascot · 8 px/unit · 14u wide × 11u tall -->

  <!-- head: two bumps at top -->
  <rect x="24" y="0"  width="24" height="8"  fill="#0f0f0f"/>
  <rect x="64" y="0"  width="24" height="8"  fill="#0f0f0f"/>

  <!-- body rows 1–2 (10u = 80px wide) -->
  <rect x="16" y="8"  width="80" height="16" fill="#0f0f0f"/>

  <!-- arm rows 3–4 (14u = 112px wide) -->
  <rect x="0"  y="24" width="112" height="16" fill="#0f0f0f"/>

  <!-- body row 5 -->
  <rect x="16" y="40" width="80" height="8"  fill="#0f0f0f"/>

  <!-- body row 6 + eyes -->
  <rect x="16" y="48" width="80" height="8"  fill="#0f0f0f"/>
  <rect x="32" y="48" width="16" height="8"  fill="#ffffff"/>
  <rect x="64" y="48" width="16" height="8"  fill="#ffffff"/>

  <!-- body row 7 + eyes -->
  <rect x="16" y="56" width="80" height="8"  fill="#0f0f0f"/>
  <rect x="32" y="56" width="16" height="8"  fill="#ffffff"/>
  <rect x="64" y="56" width="16" height="8"  fill="#ffffff"/>

  <!-- body row 8 -->
  <rect x="16" y="64" width="80" height="8"  fill="#0f0f0f"/>

  <!-- legs (2u wide × 2u tall each) -->
  <rect x="32" y="72" width="16" height="16" fill="#0f0f0f"/>
  <rect x="64" y="72" width="16" height="16" fill="#0f0f0f"/>

  <!-- wordmark -->
  <text
    x="128" y="55"
    font-family="'Courier New', Courier, monospace"
    font-weight="700"
    font-size="28"
    fill="#0f0f0f">monofarm</text>
</svg>
